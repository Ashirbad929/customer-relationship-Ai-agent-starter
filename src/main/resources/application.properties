spring.config.import=optional:file:.env[.properties]
spring.application.name=customer-relationship-agent
server.port=${SERVER_PORT:8080}
app.falkordb.url=${FALKORDB_URL:redis://localhost:6379}
app.falkordb.graph=${FALKORDB_GRAPH:customer_relationships}
agent.enabled=${AGENT_ENABLED:false}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.8-flash}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-5-mini}
logging.level.dev.customergraph=DEBUG
